<!doctype html>
<html lang="en">
  <head>
    <script>
      window.__ACTION__ = <%= htmlWebpackPlugin.options.__ACTION__ %>
    </script>
    <title>Retrospectives, Standups, Sprint Poker &amp; Team Health Checks | Parabol</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#493272" />
    <!-- Dark mode boot: apply .theme-dark before first paint. 'theme' mirrors LocalStorageKey.THEME.
         Absent or 'system' follows the OS, matching DEFAULT_THEME_PREFERENCE in themePreference.ts. -->
    <script>
      try {
        var themePref = localStorage.getItem('theme')
        if (
          themePref === 'dark' ||
          (themePref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.className += ' theme-dark'
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', '#2d1d53')
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Parabol is the open-source workspace for agile teams: run retrospectives, Sprint Poker estimation, check-ins and async standups, then measure team health with anonymous engagement surveys built on psychological safety research. Every score becomes a discussion and a task. Self-hosted or cloud, free to start."
    />
    <link href="/static/manifest.json" rel="manifest" />
    <link href="/static/favicon.ico" rel="shortcut icon" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
