name: parabol-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    env_file: ../../../.env
    ports:
      - "5432:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql"
    networks:
      - parabol-network
  pgadmin:
    image: dpage/pgadmin4:8.9
    depends_on:
      - postgres
    env_file: ../../../.env
    volumes:
      - "pgadmin-data:/var/lib/pgadmin"
    ports:
      - "5050:80"
    networks:
      - parabol-network
    restart: unless-stopped
  valkey:
    image: valkey/valkey:9.0-alpine
    command: valkey-server --save ""
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - parabol-network
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:0.9.1
    hostname: redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:valkey:6379
    ports:
      - "8081:8081"
    networks:
      parabol-network:
  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    environment:
      - MODEL_ID=Svenni551/Qwen3-Embedding-0.6B-ONNX-INT8
      - POOLING=mean
      - MAX_CLIENT_BATCH_SIZE=8
      - MAX_BATCH_TOKENS=4096
      - AUTO_TRUNCATE=true
    platform: linux/x86_64
    hostname: text-embeddings-inference
    restart: unless-stopped
    ports:
      - "3040:80"
    volumes:
      - text-embeddings-inference-data:/data
    networks:
      parabol-network:
  tei-harrier:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    profiles:
      - harrier
    environment:
      - MODEL_ID=onnx-community/harrier-oss-v1-270m-ONNX
      - REVISION=d59c919d0159aea2c19ed7d04288fcdd048d0f9c
      - POOLING=last-token
      - MAX_CLIENT_BATCH_SIZE=8
      - MAX_BATCH_TOKENS=4096
      - AUTO_TRUNCATE=true
    platform: linux/x86_64
    hostname: tei-harrier
    restart: unless-stopped
    ports:
      - "3041:80"
    volumes:
      - tei-harrier-data:/data
    networks:
      parabol-network:
networks:
  parabol-network:
volumes:
  valkey-data: {}
  postgres-data: {}
  pgadmin-data: {}
  text-embeddings-inference-data: {}
  tei-harrier-data: {}
