  '@datadog/pprof': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  cpu-features: true
  dd-trace: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true
  ssh2: true
  styled-components: true

