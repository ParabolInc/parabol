  react: '^18.3.1'
  react-dom: '^18.3.1'
  '@babel/runtime': '^7.27.1'
  'brace-expansion@1.1.11': 1.1.12
  'brace-expansion@2.0.1': 2.0.2
  source-map: 0.7.6
  qs: '^6.14.1'
