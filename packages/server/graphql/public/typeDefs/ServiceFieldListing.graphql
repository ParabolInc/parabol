"""
The estimate targets and candidate fields for a dimension on the task's service. EstimateStage.serviceField is one of options, a sentinel, or a label template
"""
type ServiceFieldListing {
  """
  How the service can receive an estimate. Empty when the task has no integration
  """
  targets: [EstimatePushTargetEnum!]!

  """
  The fields this dimension can push to. Empty for label-only services and when the task has no integration
  """
  options: [ServiceField!]!

  """
  A support doc explaining why no usable field was found. Null when a field exists or the service has none to look for
  """
  helpUrl: URL
}
