"""
An organization
"""
type Organization implements OrganizationPartial {
  """
  The unique organization ID
  """
  id: ID!

  """
  The top level domain this organization is linked to, null if only generic emails used
  """
  activeDomain: String

  """
  false if the activeDomain is null or was set automatically via a heuristic, true if set manually
  """
  isActiveDomainTouched: Boolean!

  """
  The datetime the organization was created
  """
  createdAt: DateTime!

  """
  The safe credit card details
  """
  creditCard: CreditCard

  """
  true if the viewer is the billing leader for the org
  """
  isBillingLeader: Boolean!

  """
  true if the viewer holds the the org admin role on the org
  """
  isOrgAdmin: Boolean!

  """
  The name of the organization
  """
  name: String!

  """
  The count of non-archived teams that have at least 2 members and, in the last 30 days,
  started or ended a meeting that at least 2 people joined
  """
  activeTeamCount: Int!

  """
  The number of active members at each of the given times, in the same order. A member is active
  at a time if they used Parabol in the 30 days before it, the same rule that marks members inactive
  for billing. To chart monthly active users, pass the end of each month. Accepts up to 366 times.
  """
  activeUserCounts(
    """
    The times to count active members at
    """
    at: [DateTime!]!
  ): [Int!]! @scope(name: USERS_READ)

  """
  A report on the organization's people, meetings and tasks. Billing leaders and org admins get
  every team; everyone else gets the teams they're on. Starter counts its 2 largest teams that met
  in the last 90 days
  """
  report(
    """
    What to count, how to split it, and how to show it
    """
    spec: ReportSpecInput!

    """
    The IANA time zone that days, weeks and months start in
    """
    timeZone: String! = "UTC"

    """
    The period picked on the Reports page, used when the spec's period is PAGE
    """
    pagePeriod: ReportPeriodInput
  ): ReportResult! @scope(name: REPORTS_READ)

  """
  The reports pinned to the Reports page, in order
  """
  pinnedReports: [PinnedReport!]! @scope(name: REPORTS_READ)

  """
  The questions the Ask box offers on the Reports page, in order
  """
  popularReportQuestions: [PopularReportQuestion!]! @scope(name: REPORTS_READ)

  """
  The viewer's recent questions on this organization's Reports page, newest first
  """
  recentReportQuestions: [ReportQuestion!]! @scope(name: REPORTS_READ)

  """
  The levels the organization groups its teams by in Reports, widest first. Empty while Reports is off
  """
  structure: [OrgStructureLevel!]! @scope(name: ORGS_READ)

  """
  Teams in the organization that the viewer has access to.
  For billing leaders/org admins/super users: all teams in the org (viewer's teams first).
  For regular users: teams the viewer is on plus public teams.
  """
  teams: [Team!]! @scope(name: TEAMS_READ)

  """
  The count of all teams in the organization
  """
  allTeamsCount: Int!

  """
  The datetime the current billing cycle ends
  """
  periodEnd: DateTime

  """
  The datetime the current billing cycle starts
  """
  periodStart: DateTime

  """
  Flag the organization as exceeding the tariff limits by setting a datetime
  """
  tierLimitExceededAt: DateTime

  """
  Schedule the organization to be locked at
  """
  scheduledLockAt: DateTime

  """
  Organization locked at
  """
  lockedAt: DateTime

  """
  The total number of retroMeetings given to the team
  """
  retroMeetingsOffered: Int! @deprecated(reason: "Unlimited retros for all!")

  """
  Number of retro meetings that can be run (if not pro)
  """
  retroMeetingsRemaining: Int! @deprecated(reason: "Unlimited retros for all!")

  """
  The customerId from stripe
  """
  stripeId: ID

  """
  The subscriptionId from stripe
  """
  stripeSubscriptionId: ID

  """
  The last upcoming invoice email that was sent, null if never sent
  """
  upcomingInvoiceEmailSentAt: DateTime

  """
  The datetime the organization was last updated
  """
  updatedAt: DateTime

  """
  The OrganizationUser of the viewer
  """
  viewerOrganizationUser: OrganizationUser

  """
  The users that are part of the organization
  """
  organizationUsers(after: String, first: Int): OrganizationUserConnection! @scope(name: USERS_READ)

  """
  The count of active & inactive users
  """
  orgUserCount: OrgUserCount!

  """
  The leaders of the org
  """
  billingLeaders: [OrganizationUser!]! @scope(name: USERS_READ)

  """
  The assumed company this organization belongs to
  """
  company: Company

  """
  Basic meeting metadata for aggregated stats across the entire organization.
  Includes metadata on teams the viewer is not part of
  """
  meetingStats: [MeetingStat!]! @scope(name: MEETINGS_READ)

  """
  The org avatar
  """
  picture: URL

  """
  The current subscription tier of the organization
  """
  tier: TierEnum!

  """
  Whether the org has access to AI features
  """
  useAI: Boolean!

  """
  The tier used for billing purposes (may differ from tier during trials or grace periods)
  """
  billingTier: TierEnum!

  """
  false if the Organization was explicitly marked as not paid manually or by stripe
  """
  isPaid: Boolean!

  """
  Message to show if the organization is unpaid
  """
  unpaidMessageHTML: String

  """
  When the trial started, iff there is a trial active
  """
  trialStartDate: DateTime

  """
  A discount coupon assigned to this organization, to be applied automatically on upgrade
  """
  coupon: OrganizationDiscount

  """
  Minimal details about all teams in the organization
  """
  teamStats: [TeamStat!]! @scope(name: TEAMS_READ)

  """
  Whether the org has a feature flag enabled or not
  """
  featureFlag(featureName: String!): Boolean!

  """
  The oldest SAML identity provider attached to the Organization, if any
  """
  saml: SAML @deprecated(reason: "An organization can own many identity providers. Use samls")

  """
  The SAML identity providers owned by the Organization, oldest first. Null if the viewer may not see them
  """
  samls: [SAML!]

  """
  The SAML id for the organization if it is provisioned via SAML attribute
  """
  samlId: ID

  """
  A list of domains approved by the organization to join.
  Empty if all domains are allowed
  """
  approvedDomains: [String!]!

  """
  Custom integration providers with organization scope
  """
  integrationProviders: OrgIntegrationProviders!

  """
  OAuth 2.0 Applications registered for this organization
  """
  oauthApplications: [OAuthAPIProvider!]!

  """
  Get an OAuth 2.0 Application by ID
  """
  oauthAPIProvider(providerId: ID!): OAuthAPIProvider

  """
  The feature flags the org has enabled
  """
  orgFeatureFlags: [OwnedFeatureFlag!]!
}
