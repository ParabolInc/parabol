"""
Payload returned by the createTaskIntegration mutation, which pushes an existing Parabol task to
an external issue tracker (e.g. Jira, GitHub) and links the two records together.

The task reflects the newly linked external issue (task.integration is populated with the
service-specific data and task.integrationHash is set).

The mutation fails with a GraphQL error when, for example, the task isn't found, the task is
already linked to an external service, neither the viewer nor the assignee has an active auth
token for the requested integration, or the external service call fails.
"""
type CreateTaskIntegrationPayload {
  """
  The Parabol task after it has been successfully linked to the external issue. Contains the
  updated integration metadata (integrationHash, integration service details) returned by the
  external provider.
  """
  task: Task
}
