"""
Payload returned by the deleteTask mutation. Permanently removes a task record
from the database (hard delete — not an archive or soft-delete). The task field carries
the deleted task's data, and the deletion is broadcast via the TASK subscription channel
to all team members who had visibility of the task (private tasks are only broadcast to
the task owner).
"""
type DeleteTaskPayload {
  """
  The task that was deleted, returned so clients can optimistically remove it
  from local caches or subscription listeners.
  """
  task: Task
}
