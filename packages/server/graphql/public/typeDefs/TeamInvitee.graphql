"""
What happened to one address passed to inviteToTeam
"""
type TeamInvitee {
  """
  The address as it was evaluated: trimmed and lowercased
  """
  email: String!

  """
  Whether an invitation went out, and if not, why
  """
  status: TeamInviteeStatusEnum!

  """
  Why no invitation went out, written for the inviter. Null when status is sent
  """
  message: String

  """
  The address the inviter probably meant, when the given one looks like a typo
  """
  suggestedEmail: String
}
