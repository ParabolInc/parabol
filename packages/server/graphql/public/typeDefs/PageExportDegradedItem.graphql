"""
A count of blocks that exported with reduced fidelity (by design), aggregated per block type
"""
type PageExportDegradedItem {
  """
  The Parabol block type (e.g. "mention", "taskBlock")
  """
  blockType: String!

  """
  How many instances were affected across the whole export
  """
  count: Int!

  """
  How the block was exported (e.g. "exported as plain text") — never the word "failed"
  """
  treatment: String!
}
