"""
One category of one Team Health check, for a report's side panel
"""
type ReportTeamHealthCell {
  """
  The question the check asked in the category
  """
  question: String!

  """
  The AI summary of how the team feels about the category. Null until it's written, or with too few answers
  """
  summary: String

  """
  Every 1 to 5 score, lowest first. Null below 4 answers, since the spread could point at a person
  """
  spreadScores: [Int!]

  """
  The comments people left, longest first. A signed comment names its author
  """
  comments: [ReportTeamHealthComment!]!

  """
  The category's score in this check and up to 2 before it, oldest first, leaving out checks too few people
  answered
  """
  scoreHistory: [TeamHealthScorePoint!]!
}
