"""
A notification that a page export to Confluence finished (successfully, partially, or not at all)
"""
type NotifyPageExportComplete implements Notification {
  """
  A shortid for the notification
  """
  id: ID!

  """
  UNREAD if new, READ if viewer has seen it, CLICKED if viewer clicked it
  """
  status: NotificationStatusEnum!

  """
  The datetime to activate the notification & send it to the client
  """
  createdAt: DateTime!
  type: NotificationEnum!

  """
  The id of the user who ran the export
  """
  userId: ID!

  """
  The export record with final per-page states and links
  """
  pageExport: PageExport!
}
