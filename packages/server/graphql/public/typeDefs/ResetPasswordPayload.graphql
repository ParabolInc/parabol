"""
Result of resetting a user's password
"""
type ResetPasswordPayload {
  error: StandardMutationError @deprecated(reason: "Read userErrors")

  """
  Why the password wasn't reset, if the user can fix it. Empty on success
  """
  userErrors: [UserError!]!
  """
  The ID of the user who reset their password
  """
  userId: ID

  """
  the user that changed their password
  """
  user: User
}
