"""
An Azure DevOps project, the container of work items. Projects live in an organization (dev.azure.com/{organization})
"""
type AzureDevOpsRemoteProject implements RepoIntegration {
  """
  The project's id in Azure DevOps
  """
  id: ID!

  service: IntegrationProviderServiceEnum!

  """
  The parabol teamId this issue was fetched for
  """
  teamId: ID!

  """
  The parabol userId this issue was fetched for
  """
  userId: ID!

  """
  The organization the project lives in, as its host and path, e.g. dev.azure.com/myorg
  """
  instanceId: ID!

  """
  The name of the organization the project lives in, e.g. myorg
  """
  organization: String!

  """
  The name of the project
  """
  name: String!

  """
  What createTaskIntegration and updateIntegrationRepoAccess take for this project: instanceId:projectId
  """
  integrationRepoId: ID!
}
