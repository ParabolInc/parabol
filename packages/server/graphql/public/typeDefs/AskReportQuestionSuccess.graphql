"""
The report AI made for a question, or why it couldn't
"""
type AskReportQuestionSuccess {
  """
  The question, kept in the viewer's recent questions
  """
  reportQuestion: ReportQuestion!

  """
  Why there's no report, when there isn't one
  """
  reason: String

  """
  A question about something close to it that Parabol can answer, when there's no report
  """
  suggestion: String
}
