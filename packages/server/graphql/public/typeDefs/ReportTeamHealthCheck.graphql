"""
A team's Team Health check that is its latest in a report's period for at least one category
"""
type ReportTeamHealthCheck {
  """
  The Team Health meeting
  """
  meetingId: ID!

  teamId: ID!

  """
  When the check's results were revealed
  """
  endedAt: DateTime!

  """
  1 for the team's first check, 2 for its second, and so on
  """
  checkNumber: Int!

  """
  How many people scored at least one category
  """
  respondentCount: Int!

  """
  How many people are on the team now
  """
  memberCount: Int!

  """
  Each category people scored that no later check in the period did. Empty when fewer than 3 people answered,
  since the check is hidden
  """
  categories: [ReportTeamHealthCategory!]!
}
