"""
An issue one of the viewer's sources matched while drafting
"""
type InspirationIssue {
  """
  The integration service the issue came from
  """
  service: ServiceEnum!

  """
  What the issue is, as its service names it, e.g. Pull Request or Calendar Event
  """
  kind: String!

  """
  The issue's title
  """
  title: String!

  """
  A link to the issue, if it has one
  """
  url: String

  """
  The most recent date tied to the issue: its last update, or when a calendar event starts
  """
  updatedAt: DateTime

  """
  How notable the issue looks before the AI reads it, higher first: the viewer's own work, finished
  work, long discussions and big changes rank first
  """
  importance: Float!

  """
  Why the AI left the issue out of a standup draft. Null if the draft uses it, and in a retrospective
  """
  unusedReason: String

  """
  A retrospective's draft reflection about this issue. Null when the issue isn't worth raising,
  when the AI isn't sure which column it belongs in, and in a standup
  """
  draft: InspirationItem
}
