"""
Returned when removePromptTemplate succeeds. The template is deactivated and its prompts are
soft-removed; if it was the team's selected template the settings fall back to another one.
"""
type RemovePromptTemplateSuccess {
  """
  The removed (now inactive) template
  """
  template: PromptTemplate!

  """
  The team's settings for the template's meeting type, after any selected-template fallback
  """
  meetingSettings: TeamMeetingSettings!
}
