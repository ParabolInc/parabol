"""
A question on the Reports page's popular list. Each one opens a saved report, so it works with AI off
"""
type PopularReportQuestion {
  id: ID!

  """
  A name that stays the same on every instance
  """
  key: String!

  subject: ReportSubjectEnum!

  question: String!

  """
  The report's name
  """
  title: String!

  """
  The report's spec as JSON, in the shape of ReportSpecInput
  """
  spec: String!
}
