"""
Returned when upsertTeamPromptAnswers succeeds. The viewer's answers were saved as a draft or
shared with the team
"""
type UpsertTeamPromptAnswersSuccess {
  """
  The stand-up the answers belong to
  """
  meeting: TeamPromptMeeting!

  """
  The viewer's response after the write
  """
  response: TeamPromptResponse!
}
