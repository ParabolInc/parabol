"""
An OAuth 2.0 application asking the viewer for access to their Parabol account
"""
type OAuthAuthorizationRequest {
  """
  The application name
  """
  name: String!
  """
  The organization that registered the application, whose data its access tokens are limited to. Null for an app any Parabol user can connect, like Claude
  """
  organization: Organization
  """
  When Parabol verified who runs the application, or null if nobody has checked it
  """
  verifiedAt: DateTime
  """
  The host of the application's client_id URL, or of its redirect_uri when the client_id isn't a URL
  """
  clientHost: String!
  """
  The viewer's organizations and whether each lets this application reach it. Empty for an application an organization registered
  """
  organizations: [OAuthAuthorizationOrganization!]!
  """
  The scopes the application asks for
  """
  scopes: [OAuthScopeEnum!]!
  """
  Where the viewer's browser goes after they approve or deny the request
  """
  redirectUri: String!
}
