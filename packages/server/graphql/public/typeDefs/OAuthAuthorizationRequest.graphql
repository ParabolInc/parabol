"""
An OAuth 2.0 application asking the viewer for access to their Parabol account
"""
type OAuthAuthorizationRequest {
  """
  The name the application registered itself with. Anyone can register an application under any name
  """
  name: String!
  """
  The scopes the application asks for, every scope when it names none. The viewer grants some or all of them
  """
  scopes: [OAuthScopeEnum!]!
  """
  Where the viewer's browser goes after they approve or deny the request
  """
  redirectUri: String!
}
