"""
The retrospective phase where each member answers the team's open Team Health check
"""
type TeamHealthCheckPhase implements NewMeetingPhase {
  "Unique identifier"
  id: ID!
  meetingId: ID!
  teamId: ID!

  """
  The type of phase
  """
  phaseType: NewMeetingPhaseTypeEnum!
  stages: [TeamHealthCheckStage!]!
}
