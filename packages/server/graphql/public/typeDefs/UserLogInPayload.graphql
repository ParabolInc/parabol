"""
Generic payload to send when user signs up
"""
type UserLogInPayload {
  """
  Always empty
  """
  userErrors: [UserError!]!
    @deprecated(
      reason: "Failures throw an error with a code in its extensions instead"
      deletionDate: "2026-12-02"
    )

  "ID of the signed-in user"
  userId: ID

  """
  If a new user is created
  """
  isNewUser: Boolean

  """
  The newly created user, or the existing user
  """
  user: User
}
