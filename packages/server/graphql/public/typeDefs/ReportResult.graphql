"""
The numbers behind one report
"""
type ReportResult {
  """
  The start of the period
  """
  from: DateTime!

  """
  The end of the period, exclusive
  """
  to: DateTime!

  """
  The step length when the report breaks down by time
  """
  step: ReportStepEnum

  rows: [ReportRow!]!

  """
  For a heatmap, each row's own total, which the measure works out over the whole row: a count's sum, or the
  share, median or Health score of everything in it. Matched to rows by every key but the last. Empty for
  other views
  """
  rowTotals: [ReportRow!]!

  """
  How many rows there were before the report's limit and the row cap
  """
  totalRowCount: Int!

  """
  How many teams the report counted
  """
  teamCount: Int!

  notes: [ReportNote!]!
}
