"""
The result of successfully generating inspiration items from a user's recent work
"""
type GenerateInspirationItemsPayload {
  """
  The generated inspiration items, 0 or more. They are only returned here, never saved
  """
  inspirationItems: [InspirationItem!]!

  """
  Every issue the sources matched, or in a retrospective, every issue on this page of its timeline
  """
  issues: [InspirationIssue!]!

  """
  The meeting the items were generated for
  """
  meeting: NewMeeting!

  """
  Where the next older page of a retrospective's timeline starts, to pass as before. Null once
  the page reaches the start of the sources' date range, and in a standup
  """
  nextBefore: DateTime
}
