"""
The payload returned by the addPokerTemplateScale mutation. Returns the newly created TemplateScale. If parentScaleId was provided, the new scale is a copy of that parent scale; otherwise a blank scale is created for the team.
"""
type AddPokerTemplateScalePayload {
  """
  The newly created scale, ready to be named and populated with values.
  """
  scale: TemplateScale
}
