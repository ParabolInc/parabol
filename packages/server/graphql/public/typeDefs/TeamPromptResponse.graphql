"""
A response of a single team member in a team prompt
"""
type TeamPromptResponse implements Reactable {
  """
  Team prompt response id in a format of `teamPromptResponse:idGeneratedByDatabase`
  """
  id: ID!

  """
  All the reactjis for the given reflection
  """
  reactjis: [Reactji!]!

  """
  Id of the user who created the team prompt response
  """
  userId: ID!

  """
  The user who created the response
  """
  user: User!

  """
  the content of the response
  """
  content: String!

  """
  the plain text content of the response
  """
  plaintextContent: String!

  """
  The timestamp the response was created
  """
  createdAt: DateTime!

  """
  The timestamp the response was updated at
  """
  updatedAt: DateTime!

  """
  the shared sort order for reponses
  """
  sortOrder: Float!

  """
  True once the author shared the response with the team. Until then only the author can read
  content, plaintextContent and answers
  """
  isShared: Boolean!

  """
  The first time the response was shared with the team
  """
  sharedAt: DateTime

  """
  One answer per prompt the author has written, in insertion order. Empty for another member's
  unshared draft and for legacy single-prompt responses
  """
  answers: [TeamPromptResponseAnswer!]!

  """
  The ids of the prompts the author has answered so far, visible to the whole team even while
  the response is a draft
  """
  answeredPromptIds: [ID!]!
}
