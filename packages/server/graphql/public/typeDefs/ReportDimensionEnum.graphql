"""
A way to split a report's results
"""
enum ReportDimensionEnum {
  "Time, stepping by day, week or month depending on the length of the period"
  TIME
  "Each day"
  DAY
  "Each week, starting on Monday"
  WEEK
  "Each month"
  MONTH
  "Each team"
  TEAM
  "Each person: who owns a task, who joined a meeting, or the member last seen"
  PERSON
  "Each meeting type, or none for tasks made outside a meeting"
  MEETING_TYPE
  "Each meeting template. A template only its own team can pick is named only for the people on that team"
  TEMPLATE
  "Each task status: active, stuck, future or done"
  TASK_STATUS
  "Whether a task is done or still open"
  DONE_OR_OPEN
  "How old an open task is when it's counted: under 30 days, 30 to 90, 90 to 180, or over 180"
  TASK_AGE
  "The retro group or check-in agenda item a discussion was about, from the viewer's own teams only"
  TOPIC
  "Each integration service"
  INTEGRATION
}
