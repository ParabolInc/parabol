"""
A discriminated union of all possible meeting subscription event payloads
"""
type MeetingSubscriptionPayload {
  fieldName: String!
  AddTranscriptionBotSuccess: AddTranscriptionBotSuccess
  AutogroupSuccess: AutogroupSuccess
    @deprecated(
      reason: "Superseded by SuggestedGroupsSuccess. Still selected by current clients so they re-render the board when a client loaded before the SuggestedGroups release calls the deprecated autogroup mutation. Delete with that mutation."
    )
  AddCommentSuccess: AddCommentSuccess
  CreatePollSuccess: CreatePollSuccess
  AddReactjiToReactableSuccess: AddReactjiToReactableSuccess
  CreateReflectionPayload: CreateReflectionPayload
  DeleteCommentSuccess: DeleteCommentSuccess
  DragDiscussionTopicPayload: DragDiscussionTopicPayload
  DragEstimatingTaskSuccess: DragEstimatingTaskSuccess
  EditCommentingSuccess: EditCommentingSuccess
  EditReflectionPayload: EditReflectionPayload
  EndDraggingReflectionPayload: EndDraggingReflectionPayload
  EndRetrospectiveSuccess: EndRetrospectiveSuccess
  EndTeamHealthSuccess: EndTeamHealthSuccess
  EndTeamPromptSuccess: EndTeamPromptSuccess
  FlagReadyToAdvanceSuccess: FlagReadyToAdvanceSuccess
  GenerateGroupsSuccess: GenerateGroupsSuccess
    @deprecated(
      reason: "Superseded by SuggestedGroupsSuccess. Nothing publishes this any more: it announced the reflect-phase pre-warm, which was removed so AI grouping is only computed when a user asks for it. Safe to delete along with the GenerateGroupsSuccess type once clients loaded before the SuggestedGroups release have drained."
    )
  NewMeetingCheckInPayload: NewMeetingCheckInPayload
  UpdateFacilitatorRotationSuccess: UpdateFacilitatorRotationSuccess
  RemoveReflectionPayload: RemoveReflectionPayload
  ResetReflectionGroupsSuccess: ResetReflectionGroupsSuccess
  ResetRetroMeetingToGroupStagePayload: ResetRetroMeetingToGroupStagePayload
  UngroupReflectionSuccess: UngroupReflectionSuccess
  RevealTeamHealthVotesSuccess: RevealTeamHealthVotesSuccess
  SetMeetingMusicSuccess: SetMeetingMusicSuccess
  SetPhaseFocusPayload: SetPhaseFocusPayload
  SetStageTimerPayload: SetStageTimerPayload
  SetTaskHighlightSuccess: SetTaskHighlightSuccess
  SetTeamHealthVoteSuccess: SetTeamHealthVoteSuccess
  SetTeamHealthResponseSuccess: SetTeamHealthResponseSuccess
  SetTeamHealthSpectateSuccess: SetTeamHealthSpectateSuccess
  StartDraggingReflectionPayload: StartDraggingReflectionPayload
  UpdateCommentContentSuccess: UpdateCommentContentSuccess
  UpdateDragLocationPayload: UpdateDragLocationPayload
  UpdateMeetingPromptSuccess: UpdateMeetingPromptSuccess
  UpdateNewCheckInQuestionPayload: UpdateNewCheckInQuestionPayload
  UpdatedNotification: UpdatedNotification
  UpdateReflectionContentPayload: UpdateReflectionContentPayload
  UpdateReflectionGroupTitlePayload: UpdateReflectionGroupTitlePayload
  UpdateRetroMaxVotesSuccess: UpdateRetroMaxVotesSuccess
  UpdatePokerScopeSuccess: UpdatePokerScopeSuccess
  VoteForReflectionGroupPayload: VoteForReflectionGroupPayload
  VoteForPokerStorySuccess: VoteForPokerStorySuccess
  PokerRevealVotesSuccess: PokerRevealVotesSuccess
  PokerResetDimensionSuccess: PokerResetDimensionSuccess
  PokerAnnounceDeckHoverSuccess: PokerAnnounceDeckHoverSuccess
  JoinMeetingSuccess: JoinMeetingSuccess
  SetPokerSpectateSuccess: SetPokerSpectateSuccess
  SetTaskEstimateSuccess: SetTaskEstimateSuccess
  UpsertTeamPromptResponseSuccess: UpsertTeamPromptResponseSuccess
  UpdateMeetingTemplateSuccess: UpdateMeetingTemplateSuccess
  SuggestedGroupsSuccess: SuggestedGroupsSuccess
}
