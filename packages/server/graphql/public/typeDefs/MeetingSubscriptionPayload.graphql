"""
A discriminated union of all possible meeting subscription event payloads
"""
type MeetingSubscriptionPayload {
  fieldName: String!
  AddTranscriptionBotSuccess: AddTranscriptionBotPayload
  AutogroupSuccess: AutogroupPayload
    @deprecated(
      reason: "Superseded by SuggestedGroupsPayload. Still selected by current clients so they re-render the board when a client loaded before the SuggestedGroups release calls the deprecated autogroup mutation. Delete with that mutation."
    )
  AddCommentSuccess: AddCommentPayload
  CreatePollSuccess: CreatePollPayload
  AddReactjiToReactableSuccess: AddReactjiToReactablePayload
  CreateReflectionPayload: CreateReflectionPayload
  DeleteCommentSuccess: DeleteCommentPayload
  DragDiscussionTopicPayload: DragDiscussionTopicPayload
  DragEstimatingTaskSuccess: DragEstimatingTaskPayload
  DragTeamHealthResultStageSuccess: DragTeamHealthResultStagePayload
  EditCommentingSuccess: EditCommentingPayload
  EditReflectionPayload: EditReflectionPayload
  EndDraggingReflectionPayload: EndDraggingReflectionPayload
  EndRetrospectiveSuccess: EndRetrospectivePayload
  EndTeamHealthSuccess: EndTeamHealthPayload
  EndTeamPromptSuccess: EndTeamPromptPayload
  FlagReadyToAdvanceSuccess: FlagReadyToAdvancePayload
  GenerateGroupsSuccess: GenerateGroupsPayload
    @deprecated(
      reason: "Superseded by SuggestedGroupsPayload. Nothing publishes this any more: it announced the reflect-phase pre-warm, which was removed so AI grouping is only computed when a user asks for it. Safe to delete along with the GenerateGroupsPayload type once clients loaded before the SuggestedGroups release have drained."
    )
  NewMeetingCheckInPayload: NewMeetingCheckInPayload
  UpdateFacilitatorRotationSuccess: UpdateFacilitatorRotationPayload
  RemoveReflectionPayload: RemoveReflectionPayload
  ResetReflectionGroupsSuccess: ResetReflectionGroupsPayload
  AcceptSuggestedGroupsSuccess: AcceptSuggestedGroupsPayload
  ResetRetroMeetingToGroupStagePayload: ResetRetroMeetingToGroupStagePayload
  UngroupReflectionSuccess: UngroupReflectionPayload
  RevealTeamHealthVotesSuccess: RevealTeamHealthVotesPayload
  SetMeetingMusicSuccess: SetMeetingMusicPayload
  SetPhaseFocusPayload: SetPhaseFocusPayload
  SetStageTimerPayload: SetStageTimerPayload
  SetTaskHighlightSuccess: SetTaskHighlightPayload
  SetTeamHealthVoteSuccess: SetTeamHealthVotePayload
  SetTeamHealthResponseSuccess: SetTeamHealthResponsePayload
  SetTeamHealthSpectateSuccess: SetTeamHealthSpectatePayload
  StartDraggingReflectionPayload: StartDraggingReflectionPayload
  TeamHealthCategorySummarySuccess: TeamHealthCategorySummaryPayload
  UpdateCommentContentSuccess: UpdateCommentContentPayload
  UpdateDragLocationPayload: UpdateDragLocationPayload
  UpdateNewCheckInQuestionPayload: UpdateNewCheckInQuestionPayload
  UpdatedNotification: UpdatedNotification
  UpdateReflectionContentPayload: UpdateReflectionContentPayload
  UpdateReflectionGroupTitlePayload: UpdateReflectionGroupTitlePayload
  UpdateRetroMaxVotesSuccess: UpdateRetroMaxVotesPayload
  UpdatePokerScopeSuccess: UpdatePokerScopePayload
  VoteForReflectionGroupPayload: VoteForReflectionGroupPayload
  VoteForPokerStorySuccess: VoteForPokerStoryPayload
  PokerRevealVotesSuccess: PokerRevealVotesPayload
  PokerResetDimensionSuccess: PokerResetDimensionPayload
  PokerAnnounceDeckHoverSuccess: PokerAnnounceDeckHoverPayload
  JoinMeetingSuccess: JoinMeetingPayload
  SetPokerSpectateSuccess: SetPokerSpectatePayload
  SetTaskEstimateSuccess: SetTaskEstimatePayload
  UpsertTeamPromptResponseSuccess: UpsertTeamPromptResponsePayload
  ShareTeamPromptResponsesSuccess: ShareTeamPromptResponsesPayload
  UpdateMeetingTemplateSuccess: UpdateMeetingTemplatePayload
  SuggestedGroupsSuccess: SuggestedGroupsPayload
}
