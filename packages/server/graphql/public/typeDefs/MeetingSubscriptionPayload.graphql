"""
A discriminated union of all possible meeting subscription event payloads
"""
type MeetingSubscriptionPayload {
  fieldName: String!
  AddTranscriptionBotPayload: AddTranscriptionBotPayload
  AutogroupPayload: AutogroupPayload
    @deprecated(
      reason: "Superseded by SuggestedGroupsPayload. Still selected by current clients so they re-render the board when a client loaded before the SuggestedGroups release calls the deprecated autogroup mutation. Delete with that mutation."
      deletionDate: "2026-12-02"
    )
  AddCommentPayload: AddCommentPayload
  CreatePollPayload: CreatePollPayload
  AddReactjiToReactablePayload: AddReactjiToReactablePayload
  CreateReflectionPayload: CreateReflectionPayload
  DeleteCommentPayload: DeleteCommentPayload
  DragDiscussionTopicPayload: DragDiscussionTopicPayload
  DragEstimatingTaskPayload: DragEstimatingTaskPayload
  DragTeamHealthResultStagePayload: DragTeamHealthResultStagePayload
  EditCommentingPayload: EditCommentingPayload
  EditReflectionPayload: EditReflectionPayload
  EndDraggingReflectionPayload: EndDraggingReflectionPayload
  EndRetrospectivePayload: EndRetrospectivePayload
  EndTeamHealthPayload: EndTeamHealthPayload
  EndTeamPromptPayload: EndTeamPromptPayload
  FlagReadyToAdvancePayload: FlagReadyToAdvancePayload
  GenerateGroupsPayload: GenerateGroupsPayload
    @deprecated(
      reason: "Superseded by SuggestedGroupsPayload. Nothing publishes this any more: it announced the reflect-phase pre-warm, which was removed so AI grouping is only computed when a user asks for it. Safe to delete along with the GenerateGroupsPayload type once clients loaded before the SuggestedGroups release have drained."
      deletionDate: "2026-12-02"
    )
  UpdateFacilitatorRotationPayload: UpdateFacilitatorRotationPayload
  RemoveReflectionPayload: RemoveReflectionPayload
  ResetReflectionGroupsPayload: ResetReflectionGroupsPayload
  AcceptSuggestedGroupsPayload: AcceptSuggestedGroupsPayload
  ResetRetroMeetingToGroupStagePayload: ResetRetroMeetingToGroupStagePayload
  UngroupReflectionPayload: UngroupReflectionPayload
  RetroTeamHealthCheckPayload: RetroTeamHealthCheckPayload
  RevealTeamHealthVotesPayload: RevealTeamHealthVotesPayload
  SetMeetingMusicPayload: SetMeetingMusicPayload
  SetPhaseFocusPayload: SetPhaseFocusPayload
  SetStageTimerPayload: SetStageTimerPayload
  SetTaskHighlightPayload: SetTaskHighlightPayload
  SetTeamHealthVotePayload: SetTeamHealthVotePayload
  SetTeamHealthResponsePayload: SetTeamHealthResponsePayload
  SetTeamHealthSpectatePayload: SetTeamHealthSpectatePayload
  StartDraggingReflectionPayload: StartDraggingReflectionPayload
  TeamHealthCategorySummaryPayload: TeamHealthCategorySummaryPayload
  UpdateCommentContentPayload: UpdateCommentContentPayload
  UpdateDragLocationPayload: UpdateDragLocationPayload
  UpdateNewCheckInQuestionPayload: UpdateNewCheckInQuestionPayload
  UpdatedNotification: UpdatedNotification
  UpdateReflectionContentPayload: UpdateReflectionContentPayload
  UpdateReflectionGroupTitlePayload: UpdateReflectionGroupTitlePayload
  UpdateRetroMaxVotesPayload: UpdateRetroMaxVotesPayload
  UpdatePokerScopePayload: UpdatePokerScopePayload
  VoteForReflectionGroupPayload: VoteForReflectionGroupPayload
  VoteForPokerStoryPayload: VoteForPokerStoryPayload
  PokerRevealVotesPayload: PokerRevealVotesPayload
  PokerResetDimensionPayload: PokerResetDimensionPayload
  PokerAnnounceDeckHoverPayload: PokerAnnounceDeckHoverPayload
  JoinMeetingPayload: JoinMeetingPayload
  SetPokerSpectatePayload: SetPokerSpectatePayload
  SetTaskEstimatePayload: SetTaskEstimatePayload
  UpsertTeamPromptResponsePayload: UpsertTeamPromptResponsePayload
  ShareTeamPromptResponsesPayload: ShareTeamPromptResponsesPayload
  UpdateMeetingTemplatePayload: UpdateMeetingTemplatePayload
  SetMeetingSettingsPayload: SetMeetingSettingsPayload
  SuggestedGroupsPayload: SuggestedGroupsPayload
}
