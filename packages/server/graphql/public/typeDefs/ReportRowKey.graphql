"""
A row's value for one breakdown
"""
type ReportRowKey {
  """
  A team id, person id, meeting type, template id, task status, done or open, task age, topic in lower case,
  integration service, Team Health category id, or the start of a time step as an ISO date
  """
  value: String!

  """
  A name to show for the value
  """
  label: String!

  """
  true if the period cuts this time step short
  """
  isPartial: Boolean!
}
