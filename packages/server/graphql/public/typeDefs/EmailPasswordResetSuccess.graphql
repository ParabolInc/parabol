"""
Return value for the emailPasswordReset mutation. Indicates whether a
password-reset email was successfully dispatched to the requested address.
"""
type EmailPasswordResetSuccess {
  """
  True if the email password reset was successfully sent
  """
  success: Boolean

  """
  Why no email was sent, if the user can do something about it. Empty on success
  """
  userErrors: [UserError!]!
}
