"""
Returned when the addTeamHealthTemplate mutation succeeds. Without parentTemplateId the new template
is blank and named "*New Template #N". With parentTemplateId the new template is named
"<original> Copy" (or "<original> Copy #N" for subsequent clones) and every question link from the
source template is duplicated onto the new template.
"""
type AddTeamHealthTemplateSuccess {
  """
  The newly created team health template. Use this to update the team's template list in the client cache.
  """
  teamHealthTemplate: TeamHealthTemplate!

  """
  The viewer (authenticated user) who performed the mutation.
  """
  user: User!
}
