"""
Returned when addTeamPromptTemplate succeeds. Either a blank stand-up template with one default
prompt was created for the team, or an existing stand-up template was cloned (name "<original> Copy")
with all of its active prompts. The viewer's freeCustomStandupTemplatesRemaining is decremented on
every tier, but only the starter tier is blocked once it reaches zero.
"""
type AddTeamPromptTemplateSuccess {
  """
  The newly created or cloned stand-up template
  """
  teamPromptTemplate: TeamPromptTemplate!

  """
  The viewer, so the client can refresh freeCustomStandupTemplatesRemaining
  """
  user: User!
}
