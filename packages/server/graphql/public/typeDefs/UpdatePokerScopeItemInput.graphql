input UpdatePokerScopeItemInput {
  """
  The location of the single source of truth (e.g. a jira-integrated parabol task would be "jira")
  """
  service: TaskServiceEnum!

  """
  For a vanilla Parabol task, the taskId. For an integrated task: on ADD, the TaskIntegration.id or Task.integrationHash the server returned; on DELETE, the taskId or Task.integrationHash
  """
  serviceTaskId: ID!

  """
  The action to perform
  """
  action: AddOrDeleteEnum!
}
