"""
A report pinned to the Reports page
"""
type ReportPin {
  id: ID!

  """
  The report's name
  """
  title: String!

  """
  A line about what the report shows
  """
  description: String!

  """
  The report's spec as JSON, in the shape of ReportSpecInput
  """
  spec: String!

  """
  The report's numbers
  """
  report(
    """
    The IANA time zone that days, weeks and months start in
    """
    timeZone: String! = "UTC"

    """
    The period picked on the Reports page, which a spec with the PAGE preset follows
    """
    pagePeriod: ReportPeriodInput
  ): ReportResult!
}
