"""
A value for a scale
"""
input TemplateScaleInput {
  """
  The hex color used to visually group a scale value. It must be one of the hex values the pokerScaleColors query returns, in any letter case.
  """
  color: String!

  """
  The label for this value, e.g., XS, M, L
  """
  label: String!
}
