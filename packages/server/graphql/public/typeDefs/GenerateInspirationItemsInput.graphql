"""
Parameters used to re-run Your Work integration searches server-side and generate
inspiration items from the matching issues.
"""
input GenerateInspirationItemsInput {
  """
  The meeting the items are being generated for
  """
  meetingId: ID!

  """
  The searches to draft from. A retrospective drafts from exactly one; a standup drafts one
  combined answer from all of them
  """
  sources: [InspirationSourceInput!]!

  """
  An optional custom prompt that overrides the default generation prompt
  """
  userPrompt: String
}
