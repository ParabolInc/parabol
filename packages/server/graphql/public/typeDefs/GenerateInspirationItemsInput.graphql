"""
Parameters used to re-run Your Work integration searches server-side and generate
inspiration items from the matching issues.
"""
input GenerateInspirationItemsInput {
  """
  The meeting the items are being generated for
  """
  meetingId: ID!

  """
  The searches to draft from. A standup drafts one combined answer from all of them; a
  retrospective drafts a reflection about each of the few issues worth raising
  """
  sources: [InspirationSourceInput!]!

  """
  An optional custom prompt that overrides the default generation prompt
  """
  userPrompt: String

  """
  A retrospective drafts its timeline a page at a time, newest first. Omit this for the newest
  page, then pass each page's nextBefore to draft the work just older than it
  """
  before: DateTime
}
