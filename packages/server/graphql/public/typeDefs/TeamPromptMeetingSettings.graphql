"""
Meeting settings specific to team prompt (standup) meetings
"""
type TeamPromptMeetingSettings implements TeamMeetingSettings {
  id: ID!

  """
  The type of meeting these settings apply to
  """
  meetingType: MeetingTypeEnum!

  """
  The broad phase types that will be addressed during the meeting
  """
  phaseTypes: [NewMeetingPhaseTypeEnum!]!

  "The ID of the team these settings belong to"
  teamId: ID!

  """
  The team these settings belong to
  """
  team: Team!

  """
  FK. The template that will be used to start the stand-up
  """
  selectedTemplateId: ID!

  """
  The template that will be used to start the stand-up
  """
  selectedTemplate: TeamPromptTemplate!

  """
  The stand-up templates owned by this team
  """
  teamPromptTemplates: [TeamPromptTemplate!]!
}
