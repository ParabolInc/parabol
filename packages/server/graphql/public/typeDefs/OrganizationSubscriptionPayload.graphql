"""
A discriminated union of all possible organization subscription event payloads
"""
type OrganizationSubscriptionPayload {
  fieldName: String!
  AddIntegrationProviderPayload: AddIntegrationProviderPayload
  ArchiveOrganizationPayload: ArchiveOrganizationPayload
  DowngradeToStarterPayload: DowngradeToStarterPayload
  RemoveIntegrationProviderPayload: RemoveIntegrationProviderPayload
  RemoveOrgUsersPayload: RemoveOrgUsersPayload
  ToggleAIFeaturesPayload: ToggleAIFeaturesPayload
  SetOrgUserRolePayload: SetOrgUserRolePayload
  UpdateIntegrationProviderPayload: UpdateIntegrationProviderPayload
  UpdateOrgPayload: UpdateOrgPayload
  UpdateTemplateScopePayload: UpdateTemplateScopePayload
  UpgradeToTeamTierPayload: UpgradeToTeamTierPayload
}
