"""
A discriminated union of all possible organization subscription event payloads
"""
type OrganizationSubscriptionPayload {
  fieldName: String!
  AddIntegrationProviderSuccess: AddIntegrationProviderPayload
  ArchiveOrganizationPayload: ArchiveOrganizationPayload
  DowngradeToStarterPayload: DowngradeToStarterPayload
  RemoveIntegrationProviderSuccess: RemoveIntegrationProviderPayload
  RemoveOrgUsersSuccess: RemoveOrgUsersPayload
  ToggleAIFeaturesSuccess: ToggleAIFeaturesPayload
  SetOrgUserRoleSuccess: SetOrgUserRolePayload
  UpdateIntegrationProviderSuccess: UpdateIntegrationProviderPayload
  UpdateOrgPayload: UpdateOrgPayload
  UpdateTemplateScopeSuccess: UpdateTemplateScopePayload
  UpgradeToTeamTierSuccess: UpgradeToTeamTierPayload
  UpdateOAuthAPIProviderPayload: UpdateOAuthAPIProviderPayload
}
