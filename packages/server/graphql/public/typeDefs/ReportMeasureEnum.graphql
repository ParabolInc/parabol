"""
What a report counts
"""
enum ReportMeasureEnum {
  "People who used Parabol in the 30 days before each reading"
  ACTIVE_USERS
  "People on the teams, or in the organization when every team is counted"
  MEMBERS
  "The percentage of members who used Parabol in the 30 days before each reading, or null without members"
  ACTIVE_SHARE
  "When each member last used Parabol, in milliseconds since the epoch. The period doesn't change it"
  LAST_SEEN
  "Meetings that at least 2 people joined"
  MEETINGS
  "Teams with at least 2 members that started or ended a meeting at least 2 people joined"
  TEAMS_THAT_MET
  "When the latest meeting that at least 2 people joined started, in milliseconds since the epoch"
  LAST_MEETING
  "Discussions in meetings that at least 2 people joined"
  DISCUSSIONS
  "Discussions in meetings that at least 2 people joined that led to at least 1 task"
  DISCUSSIONS_WITH_A_TASK
  "Tasks created, not counting stories pulled into Sprint Poker"
  NEW_TASKS
  "Tasks marked done"
  DONE_TASKS
  "Tasks not yet done"
  OPEN_TASKS
  "The median days from making a task to finishing it, for the tasks finished in each step"
  DAYS_TO_DONE
  "Integrations people connected, counting each person once per service"
  USER_INTEGRATIONS
  "Tasks sent to an integration, including stories pulled into Sprint Poker"
  TASKS_PUSHED
  "The average 1 to 5 answer in each team's latest Team Health check that asked about each category, from the 90 days before each reading or from the period. Compared with an earlier period, only the teams and categories this period has count. A check fewer than 3 people answered is hidden"
  HEALTH_SCORE
}
