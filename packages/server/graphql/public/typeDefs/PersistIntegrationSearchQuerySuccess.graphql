"""
Successfully saved an integration search query
"""
type PersistIntegrationSearchQuerySuccess {
  """
  The user whose search query was saved
  """
  userId: ID
  """
  The team context for the saved search query
  """
  teamId: ID
  """
  The service whose saved queries changed. Select searchQueries to pick up the saved query
  """
  service: IntegrationService!
}
