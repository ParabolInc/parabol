"""
Successfully saved an integration search query
"""
type PersistIntegrationSearchQuerySuccess {
  """
  The user whose search query was saved
  """
  userId: ID
  """
  The team context for the saved search query
  """
  teamId: ID
  """
  The updated Jira Server integration with the saved query
  """
  jiraServerIntegration: JiraServerIntegration
  """
  The updated Jira Cloud integration with its saved queries
  """
  atlassianIntegration: AtlassianIntegration
  """
  The updated GitHub integration with its saved queries
  """
  githubIntegration: GitHubIntegration
}
