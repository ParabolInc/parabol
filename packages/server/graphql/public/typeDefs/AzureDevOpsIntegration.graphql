"""
A team member's Azure DevOps connection: their OAuth2 grant and the work items and projects it
shares with the team. One exists per (team, user) pair
"""
type AzureDevOpsIntegration {
  """
  The OAuth2 grant for this team member's Azure DevOps connection. Null when they have not
  connected, or the grant was revoked
  """
  auth: TeamMemberIntegrationAuthOAuth2

  """
  Composite key in the format "ado:{teamId}:{userId}"
  """
  id: ID!

  """
  The Parabol team this connection belongs to
  """
  teamId: ID!

  """
  The Parabol user who owns this connection
  """
  userId: ID!

  """
  Work items fetched live from the projects this connection shares with the team, most recently
  changed first. A plain search matches titles, or a work item id when it is a number
  """
  workItems(
    """
    Maximum number of work items to return
    """
    first: Int = 100

    """
    Unused: results are not paginated
    """
    after: DateTime

    """
    A plain-text search string, or a WIQL WHERE clause if isWIQL is true. Null or empty returns
    the most recently changed open work items
    """
    queryString: String

    """
    Names or integrationRepoIds of shared projects to restrict the search to. Empty searches all of them
    """
    projectKeyFilters: [String!]!

    """
    True when queryString is a WIQL (Work Item Query Language) WHERE clause
    """
    isWIQL: Boolean!
  ): AzureDevOpsWorkItemConnection!

  """
  The global OAuth2 provider for Azure DevOps. Null when this instance has no credentials for it
  """
  cloudProvider: IntegrationProviderOAuth2

  """
  The team- and org-scoped OAuth2 providers for Azure DevOps on this team
  """
  sharedProviders: [IntegrationProviderOAuth2!]!
}
