"""
What a Team Health heatmap marks its cells from
"""
type ReportTeamHealth {
  """
  The latest check in the period of each category, for every team the viewer can report on, whatever the
  report's filters, so filtering never moves a mark. A team's latest check comes first
  """
  checks: [ReportTeamHealthCheck!]!

  """
  When the latest Team Health check of any team the viewer can report on revealed its results, whatever the period.
  Null when none of those teams has run one
  """
  latestCheckEndedAt: DateTime
}
