"""
The result of a user successfully joining a meeting in progress
"""
type JoinMeetingSuccess {
  """
  The ID of the meeting that was joined
  """
  meetingId: ID!

  """
  The meeting that was joined
  """
  meeting: NewMeeting!

  """
  The member who joined
  """
  meetingMember: MeetingMember!

  """
  The stages that belong to the member who joined, e.g. their check-in stage
  """
  stages: [NewMeetingStage!]!
}
