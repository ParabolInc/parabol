"""
A field on a task's service that an estimate can be pushed to. EstimateStage.serviceField is the selected one; EstimateStage.serviceFieldListing.options are the candidates
"""
type ServiceField {
  """
  The id updateIntegrationDimensionField takes. The two sentinels ("" = do not update, "__comment" = comment) and a label template are their own id
  """
  fieldId: ID!

  """
  The service's human-readable name for the field, the sentinel's display name, or the template itself for a label template
  """
  label: String!

  """
  The field type, to be used for validation and analytics
  """
  type: String!

  name: String! @deprecated(reason: "Use fieldId, or label for display")
}
