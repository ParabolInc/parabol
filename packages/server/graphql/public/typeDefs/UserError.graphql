"""
No longer returned. A problem the user can fix, such as a wrong password or an expired link, now throws an error with a code in its extensions
"""
type UserError {
  """
  What went wrong, for clients that react to it
  """
  code: UserErrorCode!

  """
  A sentence to show the user
  """
  message: String!

  """
  The argument that needs fixing, if the error is about one
  """
  field: String
}
