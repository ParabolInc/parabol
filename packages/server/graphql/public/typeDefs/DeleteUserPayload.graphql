"""
Returned by the deleteUser mutation. A deletion soft-deletes the account: it
removes the user from all teams and organizations, blacklists their JWT, clears
their auth cookie (when a user deletes their own account), and broadcasts a
mention update to replace any in-progress references to that user. The mutation
throws BAD_USER_INPUT when given both or neither of userId and email, FORBIDDEN
when deleting someone else without super-user privileges, and UNAUTHENTICATED
when a user deleting their own account signed in too long ago and must sign in
again.
"""
type DeleteUserPayload {
  """
  The deleted user
  """
  user: User!
}
