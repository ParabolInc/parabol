"""
A task-integration service, whether it is usable on this team, and what it can do
"""
interface IntegrationService {
  service: IntegrationProviderServiceEnum!
  title: String!

  """
  true if the service is configured for this team (env creds or provider row)
  """
  isAvailable: Boolean!

  """
  true if this team member has an active, usable auth row for this service on this team (for Jira, one that carries the Jira scopes). Does not validate or refresh the token
  """
  isConnected: Boolean!
  capabilities: [IntegrationCapabilityEnum!]!
  """
  The viewer's auth for this service on this team. Null when not connected
  """
  auth: TeamMemberIntegrationAuth
  """
  The global provider for this service. Null when this instance has no credentials for it
  """
  cloudProvider: IntegrationProvider
  """
  The repos/projects the viewer can create issues in on this service, in the service's own order.
  [] when not connected; null when the live fetch failed. Cached per service for 90 days unless networkOnly
  """
  repos(networkOnly: Boolean = false): [RepoIntegration!]
}
