"""
A task-integration service, whether it is usable on this team, and what it can do
"""
interface IntegrationService {
  service: IntegrationProviderServiceEnum!
  title: String!

  """
  true if the service is configured for this team (env creds or provider row)
  """
  isAvailable: Boolean!

  """
  true if the viewer has an active auth row for this service on this team. Does not validate or refresh the token
  """
  isConnected: Boolean!
  capabilities: [IntegrationCapabilityEnum!]!
  """
  The viewer's auth for this service on this team. Null when not connected or when the team member is not the viewer
  """
  auth: TeamMemberIntegrationAuth
  """
  The global provider for this service. Null when this instance has no credentials for it
  """
  cloudProvider: IntegrationProvider
}
