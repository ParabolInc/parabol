"""
A team health meeting where team members answer research-backed survey questions on a Likert scale
"""
type TeamHealthMeeting implements NewMeeting {
  """
  The viewer's most recently generated AI inspiration items for a given integration service,
  cached for a short window. Empty if none have been generated recently.
  """
  inspirationItems(service: ServiceEnum!): [InspirationItem!]!

  """
  *Foreign key. The template used to start the meeting
  """
  templateId: ID!

  """
  The team health template this meeting used
  """
  template: TeamHealthTemplate

  """
  Every team member's answers to the questions in this meeting. Empty until the meeting ends and
  the results are revealed, so raw answers can never be de-anonymized while it is in progress
  """
  responses: [TeamHealthResponse!]!

  """
  The number of distinct members who have submitted at least one response. A bare count only,
  never the member ids, so a lone response cannot be attributed to a person
  """
  respondentCount: Int!

  """
  The number of people expected to answer this cycle: everyone on the team, less anyone sitting it
  out as a spectator. Frozen when the meeting ends, since team membership drifts. This is the
  denominator for participation, and deliberately not a count of who opened the meeting
  """
  eligibleCount: Int!

  """
  respondentCount over eligibleCount, 0-1. Null when nobody was eligible to answer
  """
  participationRate: Float

  """
  The number of consecutive completed meetings in this meeting's series that had at least
  one response, counting backwards from the most recently completed meeting. 0 if this
  meeting isn't part of a series, or the meeting right before it had no responses
  """
  currentStreak: Int!

  """
  The unique meeting id. shortid.
  """
  id: ID!

  """
  The meeting series id this meeting is associated with if the meeting is recurring
  """
  meetingSeriesId: ID

  """
  The meeting series this meeting is associated with if the meeting is recurring
  """
  meetingSeries: MeetingSeries

  """
  The timestamp the meeting was created
  """
  createdAt: DateTime!

  """
  The id of the user that created the meeting, null if user was hard deleted
  """
  createdBy: ID

  """
  The user that created the meeting, null if user was hard deleted
  """
  createdByUser: User

  """
  The timestamp the meeting officially ended
  """
  endedAt: DateTime

  """
  The location of the facilitator in the meeting
  """
  facilitatorStageId: ID!

  """
  The userId (or anonymousId) of the most recent facilitator
  """
  facilitatorUserId: ID!

  """
  The facilitator team member
  """
  facilitator: TeamMember!

  """
  Is this locked for starter plans?
  """
  locked: Boolean!

  """
  The team members that were active during the time of the meeting
  """
  meetingMembers: [MeetingMember!]!

  """
  The auto-incrementing meeting number for the team
  """
  meetingNumber: Int!
  meetingType: MeetingTypeEnum!

  """
  The name of the meeting
  """
  name: String!

  """
  The organization this meeting belongs to
  """
  organization: Organization!

  """
  The phases the meeting will go through, including all phase-specific state
  """
  phases: [NewMeetingPhase!]!

  """
  If meeting has a meeting series associated, this is the time the meeting will end
  """
  scheduledEndTime: DateTime

  """
  The OpenAI generated summary of all the content in the meeting. Undefined if the user doesnt have access to the feature or it's unavailable in this meeting type
  """
  summary: String

  """
  The time the meeting summary was emailed to the team
  """
  summarySentAt: DateTime

  "The ID of the team that ran the meeting"
  teamId: ID!

  """
  The team that ran the meeting
  """
  team: Team!

  """
  The last time a meeting was updated (stage completed, finished, etc)
  """
  updatedAt: DateTime

  """
  The meeting member of the viewer
  """
  viewerMeetingMember: MeetingMember
  summaryPageId: ID
}
