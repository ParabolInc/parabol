query searchIssues($searchQuery: String!, $first: Int!, $commentLast: Int!) {
  search(query: $searchQuery, type: ISSUE, first: $first) {
    nodes {
      __typename
      ... on Issue {
        number
        title
        url
        updatedAt
        body
        issueState: state
        viewerDidAuthor
        repository {
          nameWithOwner
        }
        comments(last: $commentLast) {
          totalCount
          nodes {
            author {
              login
            }
            body
          }
        }
      }
      ... on PullRequest {
        number
        title
        url
        updatedAt
        body
        prState: state
        viewerDidAuthor
        additions
        deletions
        reviews {
          totalCount
        }
        repository {
          nameWithOwner
        }
        comments(last: $commentLast) {
          totalCount
          nodes {
            author {
              login
            }
            body
          }
        }
      }
    }
  }
}
