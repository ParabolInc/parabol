# Start a retrospective on a team with the team's selected template. To use another template, call select_template first. Needs meetings:write.
mutation StartRetrospective(
  # The team to meet, from get_me
  $teamId: ID!
) {
  startRetrospective(teamId: $teamId) {
    meeting {
      id
      name
      meetingType
      teamId
    }
  }
}
