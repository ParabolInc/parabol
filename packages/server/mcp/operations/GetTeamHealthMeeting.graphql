# Show one team health check: how many members have answered so far, and for each question its id, its 1-5 average score, how many scored it, the scores given, an AI summary when there is one, and the comment on each answer. Each question's results stay empty until the check ends. Then score is null when fewer than 3 people scored the question, and spreadScores when fewer than 4 did, so no answer can be traced to its author; respondentCount says how many did. discussionId opens the question's discussion with get_discussion. summaryPageId, when set, is a page to open with read_page. For another kind of meeting it returns no stages; use get_meeting. Timestamps are UTC. Needs users:read and meetings:read.
query GetTeamHealthMeeting(
  # The team health check's meeting id, from list_meetings or start_team_health
  $meetingId: ID!
) {
  viewer {
    meeting(meetingId: $meetingId) {
      id
      name
      meetingType
      teamId
      meetingSeriesId
      createdAt
      endedAt
      summary
      summaryPageId
      ... on TeamHealthMeeting {
        respondentCount
      }
      phases {
        ... on TeamHealthResultPhase {
          stages {
            discussionId
            question {
              id
              question
            }
            score
            respondentCount
            spreadScores
            summary
            responses {
              commentParaphrased
              commentAuthor {
                preferredName
              }
            }
          }
        }
      }
    }
  }
}
