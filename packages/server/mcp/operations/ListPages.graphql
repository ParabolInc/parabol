# List pages you can reach. Pass parentPageId for a page's sub-pages or teamId for a team's pages. When hasNextPage is true, pass pageInfo.endCursor as after for the next pages. Open one with read_page. Needs users:read and pages:read.
query ListPages(
  # Only list the sub-pages of this page
  $parentPageId: ID
  # Only list the pages of this team, from get_me
  $teamId: ID
  # Most pages to return
  $first: Int = 50
  # The pageInfo.endCursor of the previous list_pages call
  $after: String
) {
  viewer {
    pages(parentPageId: $parentPageId, teamId: $teamId, first: $first, after: $after) {
      edges {
        node {
          id
          title
          parentPageId
          teamId
          isPrivate
          updatedAt
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
