# List pages you can reach. With parentPageId it returns that page's sub-pages, with teamId the team's top-level pages, and with neither the pages you can reach at the top level. To see more, call again with a larger first. Open one with read_page. updatedAt is UTC. Needs users:read and pages:read.
query ListPages(
  # Only list the sub-pages of this page
  $parentPageId: ID = null
  # Only list the top-level pages of this team, from get_me
  $teamId: ID
  # Most pages to return
  $first: Int = 50
) {
  viewer {
    pages(parentPageId: $parentPageId, teamId: $teamId, first: $first) {
      edges {
        node {
          id
          title
          parentPageId
          teamId
          isPrivate
          updatedAt
        }
      }
      pageInfo {
        hasNextPage
      }
    }
  }
}
