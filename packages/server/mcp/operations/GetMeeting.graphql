# Show one meeting: its summary, its reflections (retrospectives) or responses (standups), and the tasks it made. summaryPageId, when set, is a page to open with read_page. Timestamps, and the dates on the summary page, are UTC. Needs users:read, meetings:read and tasks:read.
query GetMeeting(
  # The meeting id, from list_meetings or the tool that started it
  $meetingId: ID!
) {
  viewer {
    meeting(meetingId: $meetingId) {
      id
      name
      meetingType
      teamId
      createdAt
      endedAt
      summary
      summaryPageId
      ... on RetrospectiveMeeting {
        reflectionGroups {
          title
          voteCount
          prompt {
            question
          }
          reflections {
            id
            plaintextContent
          }
        }
        tasks {
          id
          plaintextContent
          status
          userId
        }
      }
      ... on ActionMeeting {
        tasks {
          id
          plaintextContent
          status
          userId
        }
      }
      ... on TeamPromptMeeting {
        responses {
          userId
          plaintextContent
        }
        tasks {
          id
          plaintextContent
          status
          userId
        }
      }
    }
  }
}
