# Move a page to Trash, as Delete page does in Parabol. It drops out of list_pages and search_pages, and read_page still opens it with deletedAt set. To bring it back, restore it from Trash in Parabol or call archivePage with action restore through graphql_mutate. Only a page's owners can trash it, and it refuses the Meeting Summaries page. Timestamps are UTC. Needs pages:write.
mutation ArchivePage(
  # The page id, from list_pages, search_pages or create_page
  $pageId: ID!
) {
  archivePage(pageId: $pageId, action: archive) {
    page {
      id
      title
      deletedAt
    }
  }
}
