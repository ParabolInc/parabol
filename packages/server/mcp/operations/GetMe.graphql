# Show who this connection acts as, with the organizations and teams it reaches. Start here to find the teamId other tools ask for. Needs users:read, orgs:read and teams:read.
query GetMe {
  viewer {
    id
    preferredName
    email
    organizations {
      id
      name
    }
    teams {
      id
      name
      orgId
    }
  }
}
