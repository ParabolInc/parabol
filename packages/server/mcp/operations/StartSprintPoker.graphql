# Start a sprint poker meeting on a team with the team's selected template. It starts with no stories: add tasks with add_poker_stories, then vote with vote_poker_story, and the facilitator uses reveal_poker_votes and set_poker_final_score. To use another template, call select_template first. It refuses a team you aren't on or whose organization can't start meetings until its bill is paid. Needs meetings:write.
mutation StartSprintPoker(
  # The team to meet, from get_me
  $teamId: ID!
) {
  startSprintPoker(teamId: $teamId) {
    meeting {
      id
      name
      meetingType
      teamId
    }
  }
}
