# Read a page as markdown, with its title and where it sits; teamId is set only on a team's top-level pages, and a sub-page follows its parent's sharing. Copy text from here into edit_page to change it. Timestamps, and the dates on a meeting summary page, are UTC. Needs pages:read.
query ReadPage(
  # The page id, from search_pages, list_pages, create_page or a meeting
  $pageId: ID!
) {
  public {
    page(pageId: $pageId) {
      id
      title
      parentPageId
      teamId
      isPrivate
      updatedAt
      content(format: markdown)
    }
  }
}
