# Delete a task for good. It is gone from Parabol and can't be restored; to close a task and keep it, set its status to done with update_task instead. An issue the task was pushed to in another tool stays there. Anyone on the task's team can delete it, and it refuses a task on a team you aren't on. Needs tasks:write.
mutation DeleteTask(
  # The task id, from list_tasks or create_task
  $taskId: ID!
) {
  deleteTask(taskId: $taskId) {
    task {
      id
    }
  }
}
