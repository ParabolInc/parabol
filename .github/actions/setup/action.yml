name: Setup
description: Restores Node and node_modules from a single cache and writes the pipeline .env
inputs:
  services:
    description: Start Postgres and Valkey in the background. Nothing waits for them, see .github/scripts/migrate.sh
    default: "false"
outputs:
  node-version:
    description: The Node version that package.json asks for
    value: ${{ steps.versions.outputs.node }}
runs:
  using: composite
  steps:
    # A service container blocks the job until its image is pulled. These pull while the dependencies are restored
    - name: Start Postgres and Valkey
      if: inputs.services == 'true'
      shell: bash
      run: |
        set -a
        source docker/images/parabol-ubi/environments/pipeline
        set +a
        docker run --detach --name postgres --publish 5432:5432 \
          --env POSTGRES_PASSWORD --env POSTGRES_USER --env POSTGRES_DB \
          pgvector/pgvector:0.8.2-pg18-trixie > "$RUNNER_TEMP/postgres.log" 2>&1 &
        docker run --detach --name valkey --publish 6379:6379 \
          valkey/valkey:9.0-alpine > "$RUNNER_TEMP/valkey.log" 2>&1 &

    - name: Read the Node version
      id: versions
      shell: bash
      run: |
        echo "node=$(jq -r '.engines.node | ltrimstr("^")' package.json)" >> "$GITHUB_OUTPUT"
        echo "nodeMajor=$(jq -r '.engines.node | ltrimstr("^") | split(".")[0]' package.json)" >> "$GITHUB_OUTPUT"

    # This Node is not on the runner image, so downloading it costs seconds that restoring it here does not
    - name: Get cached dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
          ${{ runner.tool_cache }}/node/${{ steps.versions.outputs.nodeMajor }}.*
        key: dependencies-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.versions.outputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}

    # finds the restored Node in the tool cache, and downloads it when the cache missed
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: package.json

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install node_modules
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Write the pipeline .env
      shell: bash
      run: cp docker/images/parabol-ubi/environments/pipeline .env
