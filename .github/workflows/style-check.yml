name: Style Check
on:
  push:
    branches-ignore:
      - "release-please--**"
      - "release/v**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Setup environment variables
        run: |
          NODE_VERSION=$(jq -r -j '.engines.node|ltrimstr("^")' package.json)
          echo NODE_VERSION=$NODE_VERSION >> $GITHUB_ENV
          echo NODE_VERSION=$NODE_VERSION

      - name: Get cached node modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: node_modules-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install node_modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check Code Quality
        run: pnpm exec biome ci

      - name: Check the integration scaffold still fits the files it patches
        run: |
          node scripts/newIntegration.mts scaffoldProbe --title 'Scaffold Probe' --api-url https://api.example.com --authorize-url https://example.com/oauth/authorize --token-url https://api.example.com/oauth/token --dry-run > /dev/null
          node scripts/newIntegration.mts scaffoldProbe --title 'Scaffold Probe' --self-hosted --dry-run > /dev/null
