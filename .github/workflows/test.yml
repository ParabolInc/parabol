name: Test
on:
  push:
    branches-ignore:
      - "release-please--**"
      - "release/v**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: "read"
env:
  # pnpm records each package.json version, so after a release it sees a changed workspace and reinstalls before the first script
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
# The jobs run in parallel, and each one builds only what its own checks need
jobs:
  # The suites in packages/server/__tests__ call the built server. Every other server suite runs in the unit job without one.
  # The full build makes this the slowest job, so it is the only one on a paid runner
  integration:
    runs-on: ubuntu-8cores
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          services: true

      # master builds a fresh webpack cache for branches to restore, so stale modules never pile up in it
      - name: Restore webpack cache
        if: github.ref_name != 'master'
        uses: actions/cache/restore@v4
        with:
          path: .webpackCache
          key: webpack-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.sha }}
          restore-keys: webpack-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-

      - name: Build for testing
        run: |
          .github/scripts/migrate.sh &
          migrate=$!
          pnpm build --skip-types
          wait $migrate
        env:
          WEBPACK_PERSISTENT_CACHE: true

      - name: Save webpack cache
        if: github.ref_name == 'master'
        uses: actions/cache/save@v4
        with:
          path: .webpackCache
          key: webpack-${{ runner.arch }}-${{ steps.setup.outputs.node-version }}-${{ github.sha }}

      - name: Verify source is clean
        run: git diff --quiet HEAD || (echo "Changes in generated files detected"; git diff; exit 1)

      - name: Run Predeploy for Testing
        run: pnpm predeploy

      - name: Start testing server in background
        run: |
          pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          timeout 60 bash -c 'until curl --silent --output /dev/null http://localhost:3000/graphql; do sleep 0.1; done'

      - name: Run server integration tests
        run: pnpm test:server packages/server/__tests__/
      # - name: Set Playwright Version
      #   run: |
      #     PLAYWRIGHT_VERSION=$(pnpm --filter integration-tests list @playwright/test | grep @playwright | sed -n 's/^[^ ]* //p' | tr -d '\n')
      #     echo PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION >> $GITHUB_ENV
      #     echo PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION
      # - name: Cache Playwright Browsers
      #   id: cache-playwright-browsers
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: playwright-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}

      # - name: Setup Playwright
      #   if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
      #   run: pnpm --filter integration-tests exec playwright install --with-deps

      # - name: Run Playwright Tests
      #   run: pnpm --filter integration-tests test --reporter list,junit
      #   env:
      #     PLAYWRIGHT_JUNIT_OUTPUT_NAME: ./test-results/junit/junit.xml

      - name: Store Artifacts from Failed Tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/integration-tests/test-results/
          retention-days: 7

      - name: Print server logs
        if: always()
        run: cat "$RUNNER_TEMP/server.log" 2> /dev/null || true

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          services: true

      # No embedder starts here to make its tables, and the toolbox is the only build that the script that makes them needs
      - name: Build the DBs
        run: |
          .github/scripts/migrate.sh &
          migrate=$!
          pnpm webpack --config scripts/webpack/toolbox.config.js
          wait $migrate
          node scripts/toolbox/createEmbeddingsTables.js

      - name: Run server unit tests
        run: pnpm test:server --testPathIgnorePatterns /node_modules/ packages/server/__tests__/

      - name: Run new down migrations
        run: |
          git fetch --depth=1 origin master
          LAST_COMMON_MIGRATION=$(comm -12 <(git ls-tree --name-only origin/master -- packages/server/postgres/migrations/ | xargs basename -s.ts) <(ls packages/server/postgres/migrations/ | xargs basename -s.ts) | tail -n1)
          pnpm kysely migrate:down $LAST_COMMON_MIGRATION

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
        with:
          services: true

      # pg:generate reads the tables from a migrated database, including the ones the embedder would make
      - name: Generate types
        run: |
          .github/scripts/migrate.sh &
          migrate=$!
          pnpm relay:build
          wait $migrate
          node scripts/toolbox/createEmbeddingsTables.js
          pnpm pg:generate

      - name: Verify source is clean
        run: git diff --quiet HEAD || (echo "Changes in generated files detected"; git diff; exit 1)

      - name: Typecheck
        run: pnpm typecheck

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      - name: Compile Relay artifacts
        run: pnpm relay:build --skip-types

      - name: Run client tests
        run: pnpm test:client

  report:
    needs: [integration, unit, typecheck, client]
    if: ${{ failure() && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report Status
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: failure
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_GH_ACTIONS_NOTIFICATIONS }}
